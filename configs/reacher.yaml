# DMC Reacher: bring both arm joints to the goal pose.
task: reacher
image_size: 224
world:
  env_name: ngc/ReacherJointMatch-v0
  task: qpos_match
keys_to_cache: [action]
callables:
  - method: set_state
    args:
      qpos: {value: qpos}
      qvel: {value: qvel}
  - method: set_target_qpos
    args:
      target_qpos: {value: goal_qpos}
