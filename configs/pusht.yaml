# PushT: push the T-shaped block to the goal pose.
task: pusht
image_size: 224
world:
  # PushT that records its inputs, so the oracle can replay its state.
  env_name: ngc/PushTReplay-v1
  reset_seed: 0
keys_to_cache: [action, proprio, state]
callables:
  - method: _set_state
    args:
      state: {value: state}
  - method: _set_goal_state
    args:
      goal_state: {value: goal_state}
