[project]
name = "ngc"
version = "0.2.0"
license = "MIT"
license-files = ["LICENSE"]
description = "Neighborhood Graph Cost for planning with latent world models"
readme = "README.md"
requires-python = "==3.10.*"
dependencies = [
  "stable-worldmodel @ git+https://github.com/galilai-group/stable-worldmodel@4506b1a40c4e9feacdac4150903480afe101639f",
  "dm-control==1.0.43",
  "gymnasium==1.3.0",
  "h5py==3.16.0",
  "hydra-core==1.3.7",
  "hdf5plugin==7.0.0",
  "huggingface-hub==0.36.2",
  "imageio==2.37.4",
  "lightning==2.6.6",
  "mujoco==3.10.0",
  "numpy==2.2.6",
  "omegaconf==2.3.1",
  "ogbench==1.2.1",
  "opencv-python==5.0.0.93",
  "pillow==11.3.0",
  "pygame==2.6.1",
  "pymunk==7.3.0",
  "pyyaml==6.0.3",
  "scikit-learn==1.7.2",
  "scipy==1.15.3",
  "shapely==2.1.2",
  "stable-pretraining==0.1.8",
  "torch==2.11.0",
  "torchvision==0.26.0",
  "transformers==4.57.6",
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu130", marker = "sys_platform == 'linux'" }]
torchvision = [
  { index = "pytorch-cu130", marker = "sys_platform == 'linux'" },
]

[build-system]
requires = ["uv_build>=0.9.21,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
paper = [
    "matplotlib==3.10.9",
    "opentsne==1.0.2",
    "umap-learn==0.5.12",
]

[tool.uv.build-backend]
module-root = ""

[tool.ruff]
line-length = 79
indent-width = 4

[tool.ruff.format]
indent-style = "space"
quote-style = "single"
