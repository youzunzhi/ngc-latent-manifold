[project]
name = "ngc"
version = "0.1.0"
description = "Neighborhood Graph Cost for planning with latent world models"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
  "stable-worldmodel @ git+https://github.com/galilai-group/stable-worldmodel@4506b1a40c4e9feacdac4150903480afe101639f",
  "dm-control==1.0.43",
  "h5py==3.16.0",
  "hdf5plugin==7.0.0",
  "imageio==2.37.4",
  "mujoco==3.10.0",
  "numpy==2.2.6",
  "scipy==1.15.3",
  "stable-pretraining==0.1.8",
  "torch==2.11.0",
  "torchvision==0.26.0",
  "transformers==4.57.6",
]

[dependency-groups]
dev = ["pytest"]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu130", marker = "sys_platform == 'linux'" }]
torchvision = [
  { index = "pytorch-cu130", marker = "sys_platform == 'linux'" },
]

[build-system]
requires = ["uv_build>=0.9.21,<0.10.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[tool.ruff]
line-length = 79
indent-width = 4

[tool.ruff.format]
indent-style = "space"
quote-style = "single"
